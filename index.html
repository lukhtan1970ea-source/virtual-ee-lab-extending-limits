<!DOCTYPE html>
<html>
<head>
    <style>
        #canvas-container { text-align: center; font-family: monospace; }
        canvas { border: 3px solid #4A4A4A; background-color: #F5F5F5; box-shadow: 0px 4px 10px rgba(0,0,0,0.15); border-radius: 8px; cursor: default; }
        button { background-color: #FF4B4B; color: white; border: none; padding: 8px 16px; font-size: 14px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #E03E3E; }
    </style>
</head>
<body>
<div id="canvas-container">
    <canvas id="benchCanvas" width="700" height="400"></canvas>
    <div><button id="clearBtn">🧹 Очистити всі дроти</button></div>
</div>
<script>
const canvas = document.getElementById('benchCanvas'); const ctx = canvas.getContext('2d'); const clearBtn = document.getElementById('clearBtn');

let currentStage = window.name.includes("bench_s2") ? "stage2" : (window.name.includes("bench_s3") ? "stage3" : "stage1");

let wires = []; let activeTerminal = null; let mouseX = 0; let mouseY = 0; let isDrawing = false;

// Начальный угол ручки направлен влево (минимальный ток)
let knob = { x: 150, y: 320, r: 25, angle: -Math.PI, isDragging: false };

const terminals = [
    { id: "source_plus", name: "Джерело +", x: 50, y: 60, r: 8, color: "#FF4B4B" },
    { id: "source_minus", name: "Джерело -", x: 50, y: 120, r: 8, color: "#1E1E1E" },
    { id: "ua_plus", name: "μA +", x: 320, y: 60, r: 8, color: "#FF4B4B" },
    { id: "ua_minus", name: "μA -", x: 380, y: 60, r: 8, color: "#1E1E1E" },
    { id: "ep_in", name: "ЕП Вхід", x: 560, y: 100, r: 8, color: "#FFA500" },
    { id: "ep_com", name: "ЕП Спільний", x: 620, y: 100, r: 8, color: "#1E1E1E" },
    { id: "r2_1", name: "R2 контакт 1", x: 340, y: 220, r: 8, color: "#666" },
    { id: "r2_2", name: "R2 contact 2", x: 420, y: 220, r: 8, color: "#666" },
    { id: "r1_top", name: "R1` Верх", x: 110, y: 280, r: 6, color: "#666" },
    { id: "r1_bot", name: "R1` Ниж", x: 190, y: 280, r: 6, color: "#666" },
    { id: "r1_wiper", name: "R1 Повзунок", x: 150, y: 250, r: 6, color: "#32CD32" }
];

if (currentStage === "stage2") {
    terminals.push({ id: "rsh_1", name: "Rш контакт 1", x: 320, y: 140, r: 8, color: "#8B008B" });
    terminals.push({ id: "rsh_2", name: "Rш контакт 2", x: 380, y: 140, r: 8, color: "#8B008B" });
}

function hasWire(t1, t2) {
    return wires.some(w => (w.from.id === t1 && w.to.id === t2) || (w.from.id === t2 && w.to.id === t1));
}

function sendDataToStreamlit(vals) {
    window.parent.postMessage({
        type: "LAB_UPDATE",
        stage: currentStage,
        n: vals.n,
        val: vals.I_ep
    }, "*");
}
function isConnectedInside(t1, t2) {
    if ((t1 === "r1_top" || t1 === "r1_bot") && t2 === "r1_wiper") return true;
    if ((t2 === "r1_top" || t2 === "r1_bot") && t1 === "r1_wiper") return true;
    if (t1 === "ua_plus" && t2 === "ua_minus") return true;
    if (t2 === "ua_plus" && t1 === "ua_minus") return true;
    if (t1 === "ep_in" && t2 === "ep_com") return true;
    if (t2 === "ep_in" && t1 === "ep_com") return true;
    if (t1 === "r2_1" && t2 === "r2_2") return true;
    if (t2 === "r2_1" && t1 === "r2_2") return true;
    if (t1 === "rsh_1" && t2 === "rsh_2") return true;
    if (t2 === "rsh_1" && t1 === "rsh_2") return true;
    return false;
}

function checkCircuitConnected() {
    let visited = new Set();
    let queue = ["source_plus"];
    while (queue.length > 0) {
        let current = queue.shift();
        if (current === "source_minus") return true;
        if (!visited.has(current)) {
            visited.add(current);
            wires.forEach(w => {
                if (w.from.id === current && !visited.has(w.to.id)) queue.push(w.to.id);
                if (w.to.id === current && !visited.has(w.from.id)) queue.push(w.from.id);
            });
            terminals.forEach(t => {
                if (t.id !== current && !visited.has(t.id)) {
                    if (isConnectedInside(current, t.id)) queue.push(t.id);
                }
            });
        }
    }
    return false;
}

function getCircuitValues() {
    // Переводим угол ручки [-pi, pi] в чистый коэффициент от 0.0 до 1.0
    let r1_factor = (knob.angle + Math.PI) / (2 * Math.PI);
    if (r1_factor < 0) r1_factor = 0;
    if (r1_factor > 1) r1_factor = 1;

    // Инвертируем, чтобы вращение по часовой стрелке уменьшало опір и увеличивало ток
    let r1_inverted = 1.0 - r1_factor;

    // Задаем большой диапазон для потенциометра, чтобы ток падал почти до нуля
    let r1_actual = r1_inverted * 500000.0; 
    
    const has_power = hasWire("source_plus", "r1_top") && hasWire("source_minus", "r1_bot");
    const is_closed = checkCircuitConnected();
    
    if (!has_power || !is_closed) return { I_ep: 0, n: 0, mode: currentStage === "stage3" ? "mV" : "μA" };

    if (currentStage === "stage1") {
        const total_R = 1000.0 + 4000.0 + r1_actual;
        const I = (5.0 / total_R) * 1e6; // Ток в мкА
        // n — деления. При r1_actual -> 0, ток станет 1000 мкА, стрелка уйдет далеко за 50
        return { I_ep: I, n: I, mode: "μA" };
    } 
    else if (currentStage === "stage2") {
        const has_shunt = hasWire("ua_plus", "rsh_1") && hasWire("ua_minus", "rsh_2");
        if (!has_shunt) return { I_ep: 0, n: 0, mode: "μA" };
        
        const R_parallel = (1000.0 * 111.11) / (1000.0 + 111.11);
        const total_R = R_parallel + 4000.0 + (r1_inverted * 50000.0); // Меньший предел для шунта
        const total_I = (5.0 / total_R) * 1e6;
        const I_micro = total_I * (111.11 / (1000.0 + 111.11));
        
        return { I_ep: total_I, n: I_micro, mode: "μA" };
    } 
    else { // stage3
        const R_voltmeter = 1000.0 + 4000.0;
        const total_R = (r1_inverted * 150000.0) + R_voltmeter;
        const I = 5.0 / total_R;
        const U_mv = (I * R_voltmeter) * 1000.0;
        return { I_ep: U_mv, n: I * 1e6, mode: "mV" };
    }
}

function drawMicroampermeter(n_val) {
    ctx.fillStyle = "#2B2B2B"; ctx.fillRect(260, 15, 170, 130); ctx.strokeRect(260, 15, 170, 130);
    ctx.fillStyle = "#FFFDD0"; ctx.fillRect(270, 20, 150, 95); 
    
    ctx.beginPath(); ctx.arc(345, 135, 95, -Math.PI * 0.78, -Math.PI * 0.22);
    ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.fillStyle = "#000"; ctx.font = "10px 'Courier New'"; ctx.textAlign = "center";
    for (let i = 0; i <= 50; i += 5) {
        let angle = -Math.PI * 0.75 + (i / 50.0) * (Math.PI * 0.5);
        let isMajor = (i % 10 === 0);
        let len = isMajor ? 8 : 4;
        let x1 = 345 + 95 * Math.cos(angle); let y1 = 135 + 95 * Math.sin(angle);
        let x2 = 345 + (95 - len) * Math.cos(angle); let y2 = 135 + (95 - len) * Math.sin(angle);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        if (isMajor) {
            let tx = 345 + 80 * Math.cos(angle); let ty = 135 + 80 * Math.sin(angle);
            ctx.fillText(i, tx, ty);
        }
    }
    ctx.font = "bold 14px Arial"; ctx.fillText("μА", 345, 95);

    // Расчет угла стрелки с жестким ограничением упоров (физический максимум отклонения)
    let targetAngle = -Math.PI * 0.75 + (n_val / 50.0) * (Math.PI * 0.5);
    if (targetAngle < -Math.PI * 0.78) targetAngle = -Math.PI * 0.78; // Левый упор (чуть ниже нуля)
    if (targetAngle > -Math.PI * 0.20) targetAngle = -Math.PI * 0.20; // Правый упор (за шкалой 50)

    let sx = 345 + 92 * Math.cos(targetAngle); let sy = 135 + 92 * Math.sin(targetAngle);
    ctx.beginPath(); ctx.moveTo(345, 125); ctx.lineTo(sx, sy);
    ctx.strokeStyle = "#FF0000"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(345, 125, 4, 0, 2 * Math.PI); ctx.fillStyle = "#000"; ctx.fill();
}

function drawBench() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const vals = getCircuitValues();

    ctx.fillStyle = "#EAEAEA"; ctx.fillRect(20, 20, 120, 130); ctx.strokeStyle = "#333"; ctx.strokeRect(20, 20, 120, 130);
    ctx.fillStyle = "#333"; ctx.font = "bold 11px Arial"; ctx.textAlign = "left"; ctx.fillText("Джерело =5V", 35, 40);

    drawMicroampermeter(vals.n);

    ctx.fillStyle = "#222222"; ctx.fillRect(520, 15, 160, 130); ctx.strokeStyle = "#333"; ctx.strokeRect(520, 15, 160, 130);
    ctx.fillStyle = "#0A0A0A"; ctx.fillRect(530, 25, 140, 45);
    ctx.fillStyle = "#888"; ctx.font = "bold 9px Arial"; ctx.fillText("В7-21А МУЛЬТИМЕТР", 535, 20);
    
    ctx.fillStyle = "#FF1111"; ctx.font = "bold 22px 'Courier New'"; ctx.textAlign = "right";
    ctx.fillText(vals.I_ep.toFixed(vals.mode === "μA" ? 2 : 1), 640, 55);
    ctx.font = "10px Arial"; ctx.fillText(vals.mode, 665, 52);

    ctx.beginPath(); ctx.arc(550, 100, 12, 0, 2 * Math.PI); ctx.fillStyle = "#444"; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(610, 100, 12, 0, 2 * Math.PI); ctx.fillStyle = "#444"; ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#DEB887"; ctx.fillRect(330, 195, 100, 40); ctx.strokeStyle = "#333"; ctx.strokeRect(330, 195, 100, 40);
    ctx.fillStyle = "#333"; ctx.font = "12px Arial"; ctx.textAlign = "center"; ctx.fillText("R2 = 4 кОм", 380, 220);

    ctx.fillStyle = "#D3D3D3"; ctx.fillRect(50, 195, 200, 170); ctx.strokeStyle = "#333"; ctx.strokeRect(50, 195, 200, 170);
    ctx.fillStyle = "#333"; ctx.fillText("Потенціометр R1", 150, 215);

    ctx.beginPath(); ctx.arc(knob.x, knob.y, knob.r, 0, 2 * Math.PI);
    ctx.fillStyle = "#555"; ctx.fill(); ctx.strokeStyle = "#222"; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(knob.x, knob.y);
    ctx.lineTo(knob.x + knob.r * Math.cos(knob.angle), knob.y + knob.r * Math.sin(knob.angle));
    ctx.strokeStyle = "#FFF"; ctx.lineWidth = 3; ctx.stroke();

    if (currentStage === "stage2") {
        ctx.fillStyle = "#9370DB"; ctx.fillRect(310, 115, 90, 30); ctx.strokeStyle = "#333"; ctx.strokeRect(310, 115, 90, 30);
        ctx.fillStyle = "#FFF"; ctx.font = "10px Arial"; ctx.fillText("Шунт Rш", 355, 133);
    }

    terminals.forEach(t => {
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 2 * Math.PI);
        ctx.fillStyle = t.color; ctx.fill(); ctx.strokeStyle = "#000"; ctx.stroke();
        ctx.fillStyle = "#333"; ctx.font = "9px monospace"; ctx.textAlign = "center";
        ctx.fillText(t.name, t.x, t.y - t.r - 3);
    });

    wires.forEach(w => {
        ctx.beginPath(); ctx.moveTo(w.from.x, w.from.y);
        ctx.bezierCurveTo(w.from.x, w.from.y + 40, w.to.x, w.to.y + 40, w.to.x, w.to.y);
        ctx.strokeStyle = "#0055ff"; ctx.lineWidth = 3; ctx.stroke();
    });

    if (isDrawing && activeTerminal) {
        ctx.beginPath(); ctx.moveTo(activeTerminal.x, activeTerminal.y);
        ctx.lineTo(mouseX, mouseY); ctx.strokeStyle = "rgba(0, 85, 255, 0.5)"; ctx.lineWidth = 2; ctx.stroke();
    }
}

function updateCursor(x, y) {
    let hoverElement = false;
    if (Math.hypot(x - knob.x, y - knob.y) < knob.r) hoverElement = true;
    terminals.forEach(t => {
        if (Math.hypot(x - t.x, y - t.y) < t.r + 4) hoverElement = true;
    });
    canvas.style.cursor = hoverElement ? "pointer" : "default";
}

canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left; const y = e.clientY - rect.top;
    if (Math.hypot(x - knob.x, y - knob.y) < knob.r) { knob.isDragging = true; return; }
    terminals.forEach(t => {
        if (Math.hypot(x - t.x, y - t.y) < t.r + 4) { activeTerminal = t; isDrawing = true; }
    });
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left; mouseY = e.clientY - rect.top;
    updateCursor(mouseX, mouseY);
    if (knob.isDragging) {
        knob.angle = Math.atan2(mouseY - knob.y, mouseX - knob.x);
        drawBench(); sendDataToStreamlit(getCircuitValues());
    } else if (isDrawing) {
        drawBench();
    }
});

canvas.addEventListener('mouseup', (e) => {
    if (knob.isDragging) { knob.isDragging = false; return; }
    if (!isDrawing) return;
    isDrawing = false;
    terminals.forEach(t => {
        if (t !== activeTerminal && Math.hypot(mouseX - t.x, mouseY - t.y) < t.r + 4) {
            if (!hasWire(activeTerminal.id, t.id)) {
                wires.push({ from: activeTerminal, to: t });
                drawBench(); sendDataToStreamlit(getCircuitValues());
            }
        }
    });
    activeTerminal = null; drawBench();
});

clearBtn.addEventListener('click', () => { wires = []; drawBench(); sendDataToStreamlit({I_ep: 0, n: 0, mode: "μA"}); });
setInterval(drawBench, 100);
</script>
